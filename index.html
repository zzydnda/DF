<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="DF 的个人主页">
  <title>DF · 个人主页</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f3ee;
      --ink: #18221f;
      --muted: #64716b;
      --green: #315f4b;
      --line: #d8ddd5;
      --card: #fffefa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100% - 40px, 880px); margin: 0 auto; padding: 28px 0 64px; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 36px; }
    .brand { color: var(--green); font-weight: 800; letter-spacing: .08em; }
    nav a, .contact a { color: var(--green); text-decoration-thickness: 1px; text-underline-offset: 4px; }
    .hero { padding: clamp(36px, 9vw, 92px) 0 72px; }
    .eyebrow { color: var(--green); font-size: .83rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 700px; margin: 18px 0; font-size: clamp(2.6rem, 8vw, 5.6rem); line-height: 1.05; letter-spacing: -.055em; }
    .intro { max-width: 560px; color: var(--muted); font-size: clamp(1.05rem, 2.5vw, 1.25rem); }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    h2 { margin: 0 0 12px; font-size: 1.15rem; }
    .section-heading span { color: var(--muted); font-size: .9rem; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card { min-height: 150px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
    .card small { color: var(--green); font-weight: 700; }
    .card h3 { margin: 20px 0 4px; font-size: 1.08rem; }
    .card p { margin: 0; color: var(--muted); font-size: .93rem; }
    .contact { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-top: 58px; padding: 24px 0; border-top: 1px solid var(--line); }
    .contact p { margin: 4px 0 0; color: var(--muted); }
    footer { color: var(--muted); font-size: .85rem; }
    @media (max-width: 640px) {
      main { width: min(100% - 32px, 880px); }
      nav { padding-bottom: 16px; }
      .cards { grid-template-columns: 1fr; }
      .card { min-height: 120px; }
      .contact { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <nav aria-label="主导航">
      <span class="brand">DF</span>
      <a href="#about">关于</a>
    </nav>

    <section class="hero" id="about">
      <div class="eyebrow">你好，欢迎来到我的主页</div>
      <h1>我是 DF。<br>正在把想法变成作品。</h1>
      <p class="intro">这里记录我正在探索的事情、喜欢的主题，以及一路上做出来的小项目。这个页面会慢慢长成我的个人空间。</p>
    </section>

    <section aria-labelledby="interests-title">
      <div class="section-heading">
        <h2 id="interests-title">最近在关注</h2>
        <span>一些进行中的兴趣</span>
      </div>
      <div class="cards">
        <article class="card">
          <small>01 / 学习</small>
          <h3>持续好奇</h3>
          <p>学习新知识，也记录值得回看的内容。</p>
        </article>
        <article class="card">
          <small>02 / 创作</small>
          <h3>动手做点东西</h3>
          <p>从一个小点子开始，做成可以分享的作品。</p>
        </article>
        <article class="card">
          <small>03 / 生活</small>
          <h3>保持观察</h3>
          <p>留意日常里的灵感，让生活更有意思。</p>
        </article>
      </div>
    </section>

    <section class="contact" aria-labelledby="contact-title">
      <div>
        <h2 id="contact-title">保持联系</h2>
        <p>欢迎来聊聊想法、作品或有趣的发现。</p>
      </div>
      <a href="https://github.com/zzydnda">访问我的 GitHub ↗</a>
    </section>

    <footer>© <span id="year">2026</span> DF · 用好奇心慢慢搭建</footer>
  </main>
</body>
</html>
